AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Pakka - scam check API. One function, one table, no servers.

Globals:
  Function:
    Runtime: python3.12
    # 20, not 10, so that a slow Bedrock call plus its one retry plus the
    # DynamoDB write still fit. Lambda bills for the milliseconds actually
    # used, so the headroom is free and the cut-off it prevents is not.
    Timeout: 20
    MemorySize: 256

Parameters:
  PublicUrl:
    Type: String
    Default: ""
    Description: Where the site is served, for example https://pakka.example
  WhatsAppVerifyToken:
    Type: String
    Default: ""
    Description: Any string you choose; Meta echoes it back once to verify the webhook
  WhatsAppToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: The WhatsApp access token from the Meta app dashboard
  WhatsAppPhoneId:
    Type: String
    Default: ""
    Description: The phone number ID from the same dashboard
  WhatsAppAppSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: The app secret, used to check that a webhook really came from Meta
  TwilioAuthToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Twilio auth token, used to verify the webhook signature
  TwilioWebhookUrl:
    Type: String
    Default: ""
    Description: The exact URL Twilio calls, only needed if a proxy rewrites the host
  BedrockModelId:
    Type: String
    Default: ""
    Description: >
      On-demand model id for the fallback check on messages no rule matched,
      for example anthropic.claude-<model>-<version>. Verify it exists in this
      region first: aws bedrock list-foundation-models --region <region>.
      Leave blank and no message is ever sent to Bedrock. Use a plain model id
      rather than a cross-region profile ("apac.", "us."): a profile routes the
      text out of this region, and the point of deploying in Mumbai is that it
      does not leave.

Conditions:
  HasBedrockModel: !Not [!Equals [!Ref BedrockModelId, ""]]

Resources:
  PakkaApi:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          PAKKA_TABLE: !Ref ScansTable
          # Where saved scans are readable, so the WhatsApp reply can link to
          # one. Leave it blank and the reply simply carries no link.
          PAKKA_PUBLIC_URL: !Ref PublicUrl
          # The WhatsApp front door. All four are optional: with none of them
          # set the webhook refuses verification and nothing else changes.
          WHATSAPP_VERIFY_TOKEN: !Ref WhatsAppVerifyToken
          WHATSAPP_TOKEN: !Ref WhatsAppToken
          WHATSAPP_PHONE_ID: !Ref WhatsAppPhoneId
          WHATSAPP_APP_SECRET: !Ref WhatsAppAppSecret
          # WhatsApp the easy way: Twilio's sandbox, no business account
          TWILIO_AUTH_TOKEN: !Ref TwilioAuthToken
          TWILIO_WEBHOOK_URL: !Ref TwilioWebhookUrl
          # The fallback check, for messages the rules found nothing in. Unset
          # by default, and unset means not a single call is made.
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ScansTable
        # One action on one model, and only when one is configured. A
        # cross-region inference profile would need an inference-profile ARN
        # instead, which is deliberately not what this grants.
        - !If
          - HasBedrockModel
          - Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
          - !Ref AWS::NoValue
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ['*']
          # OPTIONS is rejected here even though CORS preflight uses it —
          # Function URLs answer preflight themselves.
          AllowMethods: [GET, POST]
          AllowHeaders: [content-type]

  ScansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # 1 read and 1 write unit sit well inside the always-free 25 of each.
      # On-demand would be the right call once traffic is spiky and real, but
      # it bills per request from the first one, so it is not free-tier work.
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:          # scans are evidence, not archives
        AttributeName: expires_at
        Enabled: true

Outputs:
  ApiUrl:
    Description: Public endpoint for the scan API
    Value: !GetAtt PakkaApiUrl.FunctionUrl
  TableName:
    Value: !Ref ScansTable
